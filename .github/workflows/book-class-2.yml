name: Auto Book Cult Class HRX

on:
  schedule:
    # Runs at 16:35 UTC (10:05 PM IST) on Sun, Tue, Fri
    # Sunday  (0) -> Books Thursday
    # Tuesday (2) -> Books Saturday
    # Friday  (5) -> Books Tuesday
    - cron: '35 16 * * 0,2,5'
  workflow_dispatch:

jobs:
  book-class:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      
      - name: Install dependencies
        run: bun install
      
      - name: Run booking script
        env:
          CURL_COMMAND: ${{ secrets.CURL_COMMAND }}
          PREFERRED_CENTER: ${{ secrets.PREFERRED_CENTER }}
          PREFERRED_SLOTS: ${{ secrets.PREFERRED_SLOTS }}
          PREFERRED_WORKOUT: ${{ secrets.PREFERRED_WORKOUT_2 }}
          ENABLE_WAITLIST: ${{ secrets.ENABLE_WAITLIST }}
        run: bun index.js
